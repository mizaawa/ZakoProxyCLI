name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-quality:
    name: Rust Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release version consistency
        run: |
          python3 scripts/check-release-version.py
          python3 scripts/import-kimi-break.py --check
          python3 scripts/import-hanshuang.py --check
          python3 scripts/import-ai-jailbreak.py --check
          python3 scripts/import-coldcoffee-gpt.py --check
          python3 scripts/import-coldcoffee-full.py --check
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-targets --all-features

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [rust-quality, backend-tests, frontend]
    env:
      COMPOSE_PROJECT_NAME: zakoai-ci-compose
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Validate Compose and build image
        run: |
          docker compose config --quiet
          docker compose pull
          docker compose build --pull
          docker tag ghcr.io/mizaawa/zakoai-proxy-cli:latest zakoai-proxy:ci
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$(docker image inspect zakoai-proxy:ci --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$version"
      - name: Test real Docker replacement and rollback
        shell: bash
        run: |
          set -euo pipefail
          test_binary="$(cargo test --locked --lib --no-run --message-format=json \
            | python3 -c 'import json,sys; artifacts=[json.loads(line) for line in sys.stdin]; print(next(item["executable"] for item in artifacts if item.get("reason") == "compiler-artifact" and item.get("profile", {}).get("test") and item.get("executable")))')"
          sudo env UPDATER_TEST_IMAGE=zakoai-proxy:ci "$test_binary" \
            update::tests::real_docker_replacement_and_rollback_preserve_login_and_data \
            --ignored --nocapture
      - name: Smoke test nonroot image and persistent setup
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name zakoai-ci --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true --publish 127.0.0.1:1990:1990 \
            --volume zakoai-ci-data:/data zakoai-proxy:ci
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:1990/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:1990/health \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
          curl --fail --silent --show-error http://127.0.0.1:1990/api/bootstrap \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["initialized"] is False'
          curl --fail --silent --show-error http://127.0.0.1:1990/ | grep -F '<title>'
          curl --fail --silent --show-error http://127.0.0.1:1990/assets/third-party-licenses.txt \
            | grep -F 'SIL OPEN FONT LICENSE'
          test "$(docker exec zakoai-ci id -u)" = 10001
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:1990/v1/models)" = 401
          SMOKE_PASSWORD="$(openssl rand -hex 24)"
          curl --fail --silent --show-error http://127.0.0.1:1990/api/setup \
            --header 'Content-Type: application/json' --header 'X-Console-Path: /' \
            --data "{\"username\":\"ci-smoke\",\"password\":\"${SMOKE_PASSWORD}\"}" > /dev/null
          docker restart zakoai-ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:1990/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:1990/api/bootstrap \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["initialized"] is True'
          docker exec zakoai-ci test -s /data/master.key
          docker exec zakoai-ci test -s /data/zako.db
      - name: Smoke test isolated site-update controller
        env:
          COMPOSE_PROJECT_NAME: zakoai-ci-compose
          ZAKO_PORT: "1991"
        run: |
          set -euo pipefail
          touch .env
          docker compose up -d --no-build --wait --wait-timeout 120
          python3 - <<'PY'
          import http.cookiejar, json, secrets, tomllib, urllib.error, urllib.request
          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['package']['version']
          base = 'http://127.0.0.1:1991'
          client = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def call(path, body=None, expected=200):
              req = urllib.request.Request(base + path, data=json.dumps(body).encode() if body is not None else None,
                  headers={'Content-Type':'application/json','X-Console-Path':'/'})
              try:
                  response = client.open(req, timeout=30)
              except urllib.error.HTTPError as response:
                  assert response.code == expected, response.code
                  return json.load(response)
              assert response.status == expected
              return json.load(response)
          call('/api/updates', expected=401)
          call('/api/setup', {'username':'ci-updater','password':secrets.token_urlsafe(32)})
          status = call('/api/updates')
          assert status['configured'] and not status.get('error'), status
          assert status['current_version'] == version
          call('/api/updates', {'tag':'v' + version,'current_password':'wrong-password'}, 403)
          assert call('/api/bootstrap')['authenticated']
          call('/api/updates', {'tag':'--help','current_password':'wrong-password'}, 400)
          print('PASS updater health, authenticated status, strict tag and password verification; session retained')
          PY
          proxy=$(docker compose ps -q proxy)
          controller=$(docker compose ps -q updater)
          test "$(docker inspect "$controller" --format '{{len .HostConfig.PortBindings}}')" = 0
          test "$(docker exec "$controller" curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/status)" = 401
          docker inspect "$proxy" --format '{{json .Mounts}}' | python3 -c 'import json,sys; assert all(m["Destination"] != "/var/run/docker.sock" for m in json.load(sys.stdin))'
          docker compose down -v
      - name: Publish tested image
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep the deployed image coordinate stable across repository renames.
          IMAGE_NAME: ghcr.io/mizaawa/zakoai-proxy-cli
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker tag zakoai-proxy:ci "${image}:${GITHUB_SHA}"
          docker tag zakoai-proxy:ci "${image}:latest"
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:latest"
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs zakoai-ci 2>&1 || true
          docker inspect zakoai-ci --format '{{json .State.Health}}' || true
          docker rm --force zakoai-ci || true
          docker volume rm zakoai-ci-data || true
          COMPOSE_PROJECT_NAME=zakoai-ci-compose ZAKO_PORT=1991 docker compose logs --tail=30 || true
          COMPOSE_PROJECT_NAME=zakoai-ci-compose ZAKO_PORT=1991 docker compose down -v || true
